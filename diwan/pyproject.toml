[project]
name = "diwan"
version = "0.1.0"
description = "Turn daily work notes into structured Saviom timesheet entries."
readme = "README.md"
authors = [{ name = "Alkindi42", email = "alkindus42@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.3",
    "playwright>=1.64.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
diwan = "diwan.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
